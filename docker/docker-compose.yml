version: '3.7'
services:
  db:
    container_name: md_postgres
    image: postgres:15.1
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: changeme
    restart: always
    expose:
      - "5432"
  minio:
    container_name: md_minio
    image: ghcr.io/versity/versitygw:latest
    volumes:
      - ../media/s3:/data/s3
      - ../media/versioning:/data/versioning
      - ../media/iam:/data/iam
      - ../media/sidecar:/data/sidecar
    expose:
      - "9000"
    ports:
      - 9000:9000
    environment:
      ROOT_ACCESS_KEY: minio
      ROOT_SECRET_KEY: minio123
      VGW_PORT: ":9000"
      VGW_IAM_DIR: /data/iam
      VGW_VERSIONING_DIR: /data/versioning
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_META_SIDECAR: /data/sidecar
      VGW_CORS_ALLOW_ORIGIN: "*"
    restart: unless-stopped
  nginx:
    container_name: md_nginx
    image: rphlo/nginx:latest
    volumes:
      - ../:/app/:ro
      - ../nginx:/etc/nginx/conf.d:ro
    command: ['nginx', '-g', 'daemon off;']
    build:
      context: "."
    depends_on:
      - minio
      - django
    ports:
      - "3000:80"
  smtp:
    container_name: md_mailpit
    image: axllent/mailpit:latest
    expose:
      - "1025"
    ports:
      - 3025:8025
    volumes:
      - ../media:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  django:
    platform: linux/x86_64
    container_name: md_django
    image: rphlo/mapdump-dev-server:latest
    stop_signal: SIGINT
    volumes:
      - ../:/app/:rw
    environment:
      DATABASE_URL: postgres://app_user:changeme@db/app_db
      VITE_API_URL: http://localhost:3000/api
      VITE_AVATAR_ROOT: http://localhost:3000/
    expose:
      - "8000"
    user: ${USERID}:${GROUPID}
    depends_on:
      - db
    links:
      - minio
      - db
      - smtp
    command: ['python', 'manage.py', 'runserver', '0.0.0.0:8000']
